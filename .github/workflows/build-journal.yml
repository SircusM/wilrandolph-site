name: Build journal pages

# Runs whenever posts.json (or the build script) changes on the main branch.
# Regenerates journal/<id>.html pages and the data blocks inside journal.html,
# then commits the result. Vercel deploys the follow-up commit automatically.
# Net effect: editing posts.json and pushing is the entire publishing workflow.

on:
  push:
    branches: [main, master]
    paths:
      - posts.json
      - build_journal.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run journal build
        run: python3 build_journal.py

      - name: Commit generated pages
        run: |
          git config user.name "journal-build-bot"
          git config user.email "actions@github.com"
          git add journal/ journal.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-build journal pages from posts.json"
            git push
          fi
